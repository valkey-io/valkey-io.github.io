<text x="824" y="653" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#1D2C3D" text-anchor="start" letter-spacing="0">Valkey Search</text>
<rect x="1080" y="599" width="252" height="70" rx="13" fill="#FFF4DD"/>
