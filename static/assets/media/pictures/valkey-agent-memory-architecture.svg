<text x="1094" y="567" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#1D2C3D" text-anchor="start" letter-spacing="0">Streams</text>
<rect x="810" y="599" width="258" height="70" rx="13" fill="#F2EDFA"/>
