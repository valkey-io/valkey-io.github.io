<text x="45" y="880" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#506175" text-anchor="start" letter-spacing="0">Pre-turn: resolve → read → rank → inject.  Post-turn: extract → validate / dedupe → write / expire.</text>
