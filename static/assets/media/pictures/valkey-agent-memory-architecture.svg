<text x="171" y="468" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="750" fill="#7355AF" text-anchor="start" letter-spacing="0">MEMORY CONTROL PLANE</text>
<text x="819" y="468" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="750" fill="#127F7C" text-anchor="start" letter-spacing="0">VALKEY MEMORY PLANE</text>
