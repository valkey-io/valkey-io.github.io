<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 730" width="760" height="730" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --line:#57606a; --box:#f6f8fa; --boxs:#d0d7de; --hi:#fff1e5; --his:#d4a373; --dec:#ddf4ff; --decs:#54aeff; --term:#dafbe1; --terms:#4ac26b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --line:#8b949e; --box:#161b22; --boxs:#30363d; --hi:#2d1f12; --his:#bd7b3a; --dec:#0c2d4a; --decs:#388bfd; --term:#0f2e1b; --terms:#2ea043; }
    }
    .bg { fill: var(--bg); }
    text { fill: var(--fg); text-anchor: middle; dominant-baseline: middle; }
    .lbl { font-size: 13px; font-weight: 600; fill: var(--line); }
    .edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
    .box { fill: var(--box); stroke: var(--boxs); stroke-width: 1.5; }
    .hi { fill: var(--hi); stroke: var(--his); stroke-width: 1.5; }
    .dec { fill: var(--dec); stroke: var(--decs); stroke-width: 1.5; }
    .term { fill: var(--term); stroke: var(--terms); stroke-width: 1.5; }
    .arrow { fill: var(--line); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Start -->
  <rect class="term" x="250" y="20" width="260" height="46" rx="23"/>
  <text x="380" y="43" font-weight="600">Main Event Loop Wake</text>
  <path class="edge" d="M380,66 V103" marker-end="url(#a)"/>

  <!-- Decision 1 -->
  <polygon class="dec" points="380,105 540,155 380,205 220,155"/>
  <text x="380" y="146">Did high-priority</text>
  <text x="380" y="165">multiplexer fire?</text>

  <!-- Yes branch -->
  <path class="edge" d="M220,155 H200 V238" marker-end="url(#a)"/>
  <text class="lbl" x="196" y="140">Yes</text>
  <!-- No branch -->
  <path class="edge" d="M540,155 H560 V238" marker-end="url(#a)"/>
  <text class="lbl" x="566" y="140">No</text>

  <!-- Drain HP -->
  <rect class="hi" x="80" y="240" width="240" height="60" rx="8"/>
  <text x="200" y="261">Drain High-Priority</text>
  <text x="200" y="280">Events Completely</text>

  <!-- Normal batch (No) -->
  <rect class="box" x="440" y="240" width="240" height="60" rx="8"/>
  <text x="560" y="261">Process Batch of</text>
  <text x="560" y="280">Normal Client Events</text>

  <path class="edge" d="M200,300 V358" marker-end="url(#a)"/>
  <path class="edge" d="M560,300 V390 H322" marker-end="url(#a)"/>

  <!-- Begin normal batch -->
  <rect class="box" x="80" y="360" width="240" height="60" rx="8"/>
  <text x="200" y="381">Begin Normal Client</text>
  <text x="200" y="400">Event Batch</text>
  <path class="edge" d="M200,420 V478" marker-end="url(#a)"/>

  <!-- Decision 2 -->
  <polygon class="dec" points="200,480 355,530 200,580 45,530"/>
  <text x="200" y="521">Every 4 events:</text>
  <text x="200" y="540">elapsed &gt; 1 ms?</text>

  <!-- Yes -> preempt -->
  <path class="edge" d="M355,530 H438" marker-end="url(#a)"/>
  <text class="lbl" x="396" y="516">Yes</text>
  <rect class="hi" x="440" y="500" width="240" height="60" rx="8"/>
  <text x="560" y="521">Preemptively Poll &amp; Drain</text>
  <text x="560" y="540">High-Priority Events</text>

  <!-- No -> complete -->
  <path class="edge" d="M200,580 V638" marker-end="url(#a)"/>
  <text class="lbl" x="218" y="608">No</text>
  <rect class="term" x="80" y="640" width="240" height="50" rx="25"/>
  <text x="200" y="665" font-weight="600">Complete Main Cycle</text>
</svg>
