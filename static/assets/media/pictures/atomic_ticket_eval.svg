<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">How Valkey runs a Lua script</title>
  <desc id="desc">Request A sends a Lua script to Valkey. Valkey runs GET, a check, SADD, and DECR as one step. Request B waits until the script finishes, so no other command runs in between.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4a63"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2733; }
    .label { font-size: 16px; }
    .title { font-size: 18px; font-weight: 600; }
    .step { font-size: 15px; font-weight: 600; fill: #24407a; }
    .note { font-size: 14px; fill: #3a4a63; }
  </style>

  <rect x="0" y="0" width="760" height="256" rx="12" fill="#ffffff"/>

  <!-- Requests -->
  <rect x="30" y="60" width="150" height="56" rx="8" fill="#f3f5f8" stroke="#3a4a63" stroke-width="1.5"/>
  <text class="label" x="105" y="94" text-anchor="middle">Request A</text>

  <rect x="30" y="170" width="150" height="56" rx="8" fill="#f3f5f8" stroke="#3a4a63" stroke-width="1.5"/>
  <text class="label" x="105" y="204" text-anchor="middle">Request B</text>

  <!-- Valkey -->
  <rect x="300" y="24" width="430" height="208" rx="10" fill="#ffffff" stroke="#3a4a63" stroke-width="1.5"/>
  <text class="title" x="322" y="54">Valkey</text>

  <!-- Lua script, one step -->
  <rect x="320" y="72" width="390" height="140" rx="8" fill="#eaf0fb" stroke="#24407a" stroke-width="1.5"/>
  <text class="label" x="340" y="100">Lua script, runs as one step</text>

  <rect x="338" y="120" width="76" height="40" rx="6" fill="#ffffff" stroke="#24407a"/>
  <text class="step" x="376" y="145" text-anchor="middle">GET</text>
  <rect x="430" y="120" width="76" height="40" rx="6" fill="#ffffff" stroke="#24407a"/>
  <text class="step" x="468" y="145" text-anchor="middle">check</text>
  <rect x="522" y="120" width="76" height="40" rx="6" fill="#ffffff" stroke="#24407a"/>
  <text class="step" x="560" y="145" text-anchor="middle">SADD</text>
  <rect x="614" y="120" width="76" height="40" rx="6" fill="#ffffff" stroke="#24407a"/>
  <text class="step" x="652" y="145" text-anchor="middle">DECR</text>

  <line x1="414" y1="140" x2="428" y2="140" stroke="#3a4a63" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="506" y1="140" x2="520" y2="140" stroke="#3a4a63" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="598" y1="140" x2="612" y2="140" stroke="#3a4a63" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text class="note" x="515" y="192" text-anchor="middle">No other command runs in between</text>

  <!-- Arrows from requests -->
  <line x1="180" y1="88" x2="318" y2="104" stroke="#3a4a63" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="note" x="246" y="80" text-anchor="middle">runs first</text>

  <line x1="180" y1="198" x2="298" y2="198" stroke="#3a4a63" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text class="note" x="240" y="188" text-anchor="middle">waits</text>
</svg>
