name: Check the website's links
description: >
  Checks a built site for links to missing pages or #anchors, and for doc links that weren't
  converted to site URLs. Given a build from before the change, fails only on problems the change
  causes. Without, fails on every problem.

inputs:
  after:
    description: The built site to check, relative to the workspace (e.g. website/public).
    required: true
  before:
    description: A built site from before the change to compare with, relative to the workspace. Leave empty if there is none.
    default: ''

runs:
  using: composite
  steps:
    - name: Install lychee
      shell: bash
      env:
        LYCHEE_VERSION: v0.24.2
        LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
      run: |
        curl -sSfL -o "$RUNNER_TEMP/lychee.tar.gz" \
          "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
        echo "$LYCHEE_SHA256  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    # Uses the scripts from the same commit as this action, so a change to a check is used on both
    # builds. Runs both even if the first fails.
    - name: Check links
      shell: bash
      env:
        BEFORE: ${{ inputs.before }}
        AFTER: ${{ inputs.after }}
      run: |
        build=$(git -C "$GITHUB_ACTION_PATH" rev-parse --show-toplevel)/build
        before=-
        if [ -n "$BEFORE" ]; then before=$BEFORE; fi
        status=0
        for check in broken-links.sh unconverted-doc-links.sh; do
          echo "$check:"
          "$build/compare-problems.sh" "$before" "$AFTER" "$build/$check" || status=1
        done
        exit "$status"
