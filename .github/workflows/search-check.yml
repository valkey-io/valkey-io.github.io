# Builds the site and checks its search index. Includes scheduled posts (drafts) so they are checked
# before being merged.

name: Search check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: search-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: website

      - name: Build with drafts
        uses: ./website/.github/actions/build-site
        with:
          path: website
          drafts: true

      - name: Check search index
        working-directory: website
        run: python3 build/check-search-index.py public
