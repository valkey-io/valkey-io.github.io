# Builds the site before and after the PR and checks its search index. Fails if the PR causes a
# problem. Problems already there before the PR, such as ones from other repos, are listed but don't
# fail the check. Includes scheduled posts (drafts) so they are checked before being merged.

name: Search check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: search-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  search-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: website

      - name: Build this PR
        uses: ./website/.github/actions/build-site
        with:
          path: website
          drafts: true

      - name: Build the base
        id: base
        uses: ./website/.github/actions/build-base
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          drafts: true

      - name: Check search index
        uses: ./website/.github/actions/check-search-index
        with:
          before: ${{ steps.base.outputs.site }}
          after: website/public

      # Only checks when this PR changes the Pagefind version or the list of sites. Those are the
      # only changes in this repo that can stop search from merging the other sites.
      - name: Check the other Valkey sites have a copy of their search index for this Pagefind version
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ steps.base.outputs.site }}
        run: |
          version() { jq -r .version "$1/pagefind/pagefind-entry.json" 2>/dev/null || echo none; }
          if [ "$(version "$BASE")" = "$(version website/public)" ] \
            && cmp -s base/static/cross-site-search.json website/static/cross-site-search.json; then
            echo "This PR doesn't change the Pagefind version or the list of sites, so there's nothing to check."
            exit 0
          fi
          ./website/build/index-copies.sh check
