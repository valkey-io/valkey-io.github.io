# Builds the site before and after the PR. Fails if the PR breaks internal links.
# Links already broken before the PR are listed but don't fail the check.

name: Link check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  internal-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: website

      - name: Build this PR
        uses: ./website/.github/actions/build-site
        with:
          path: website

      - name: Build the base
        id: base
        uses: ./website/.github/actions/build-base
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Check links
        uses: ./website/.github/actions/check-links
        with:
          before: ${{ steps.base.outputs.site }}
          after: website/public
