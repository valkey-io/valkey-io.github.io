name: Preview deploy (manual)

# Manually-triggered preview deploy to GitHub Pages for PM/stakeholder review.
# Builds the chosen branch with base_url overridden to this fork's project-site
# Pages URL, so absolute links, feeds, and the sitemap resolve correctly.
#
# Prerequisite (one-time, in repo Settings -> Pages):
#   Set "Build and deployment" -> Source to "GitHub Actions".

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch (or ref) to build and deploy"
        required: true
        default: "main"

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys so overlapping runs don't race each other.
concurrency:
  group: "pages-preview"
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.22.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website (selected branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          path: website

      - name: Checkout valkey-doc
        uses: actions/checkout@v4
        with:
          repository: valkey-io/valkey-doc
          path: valkey-doc

      - name: Checkout valkey
        uses: actions/checkout@v4
        with:
          repository: valkey-io/valkey
          path: valkey

      - name: Checkout valkey-bloom
        uses: actions/checkout@v4
        with:
          repository: valkey-io/valkey-bloom
          path: valkey-bloom

      - name: Checkout valkey-search
        uses: actions/checkout@v4
        with:
          repository: valkey-io/valkey-search
          path: valkey-search

      - name: Checkout valkey-json
        uses: actions/checkout@v4
        with:
          repository: valkey-io/valkey-json
          path: valkey-json

      - name: Init commands, topics and clients
        run: |
          cd website
          ./build/init-topics-and-clients.sh ../valkey-doc/topics \
            ../valkey-doc/clients
          ./build/init-commands.sh ../valkey-doc/commands \
            ../valkey/src/commands ../valkey-bloom/src/commands \
            ../valkey-json/src/commands ../valkey-search/src/commands

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz
          sudo mv zola /usr/local/bin/zola
          zola --version

      - name: Build with base_url override
        run: |
          cd website
          # configure-pages resolves the project-site base path
          # (e.g. https://<owner>.github.io/<repo>) into base_url.
          zola build --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
