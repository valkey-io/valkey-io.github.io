name: Deploy website

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
      # Stores the link check result. We don't want this to block deployments, so
      # a separate job marks the run as failed instead.
      link-check-outcome: ${{ steps.links.outcome }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
          path: website

      - name: Build
        uses: ./website/.github/actions/build-site
        with:
          path: website

      # Checks the links without blocking the deploy. Most broken links are in content from other
      # repositories (valkey-doc, valkey and the modules), and blocking would hold back site updates
      # until they're fixed there.
      - name: Check links
        id: links
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: ./website/.github/actions/check-links
        with:
          path: website

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./website/public

  validate:
    needs: build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/validate-libraries.yml
    with:
      ref: ${{ needs.build.outputs.commit }}
    permissions:
      contents: read

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, validate]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Marks the run as failed if the link check failed, so broken links are noticed without blocking
  # deployments.
  links:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Internal links
        env:
          OUTCOME: ${{ needs.build.outputs.link-check-outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "::error::Internal links fail on the deployed site. See the build job's log for the list."
            exit 1
          fi
          echo "Every internal link passes."
