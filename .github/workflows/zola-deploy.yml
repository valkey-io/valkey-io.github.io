name: Deploy website

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
          path: website

      - name: Build
        uses: ./website/.github/actions/build-site
        with:
          path: website

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./website/public

  # Deploys wait for these.
  blocking-checks:
    needs: build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/validate-libraries.yml
    with:
      ref: ${{ needs.build.outputs.commit }}
    permissions:
      contents: read

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, blocking-checks]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Deploys don't wait for these. The target of these checks comes from other repositories
  # (valkey-doc, valkey, etc.), so blocking would hold back site updates until external fixes could
  # be made. The checks here are intended as primarily informational.
  non-blocking-checks:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}

      - name: Download the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-pages

      - name: Unpack the built site
        run: mkdir public && tar -xf artifact.tar -C public

      - name: Check search index
        run: python3 build/check-search-index.py public
