name: Deploy website

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Stores the check results. We don't want these to block deployments, so
      # separate jobs mark the run as failed instead.
      search-index-outcome: ${{ steps.search-index.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
          path: website

      - name: Build
        uses: ./website/.github/actions/build-site
        with:
          path: website

      # Doesn't block deploys. Many titles come from other repositories, and blocking would hold back
      # site updates until they're fixed there.
      - name: Check search index
        id: search-index
        if: github.event_name != 'pull_request'
        continue-on-error: true
        working-directory: website
        run: python3 build/check-search-index.py public

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./website/public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Marks the run as failed if the search index check failed on a deploy.
  search-index:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions: {}
    steps:
      - name: Search index
        env:
          OUTCOME: ${{ needs.build.outputs.search-index-outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "::error::The search index check fails on the deployed site. See the build job's Check search index step for the pages."
            exit 1
          fi
          echo "The search index check passes."
