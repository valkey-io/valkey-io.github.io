<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 300" width="818" height="300">
<style>
  .fd-background { fill: #ffffff; fill: var(--fd-background, #ffffff); }
  .fd-title { fill: #002a3a; fill: var(--fd-text, #002a3a); }
  .fd-field-box { fill: #6983ff; fill: var(--fd-field-fill, #6983ff); stroke: #30176e; stroke: var(--fd-field-border, #30176e); stroke-width: 1; }
  .fd-extra-box { fill: #6983ff; fill: var(--fd-field-fill, #6983ff); fill-opacity: 0.18; stroke: #30176e; stroke: var(--fd-field-border, #30176e); stroke-width: 1; }
  .fd-padding-box { fill: url(#fd-hatch); stroke: #b9c2cc; stroke: var(--fd-padding-stroke, #b9c2cc); stroke-width: 1; }
  .fd-field-label { fill: #ffffff; fill: var(--fd-field-text, #ffffff); }
  .fd-callout-label { fill: #002a3a; fill: var(--fd-text, #002a3a); }
  .fd-muted { fill: #666666; fill: var(--fd-muted, #666666); }
  .fd-leader-line { stroke: #666666; stroke: var(--fd-muted, #666666); stroke-width: 1; fill: none; }
  .fd-pointer-arrow { stroke: #002a3a; stroke: var(--fd-text, #002a3a); stroke-width: 1.5; fill: none; }
  .fd-pointer-head { fill: #002a3a; fill: var(--fd-text, #002a3a); }
  .fd-hatch-background { fill: #f5f7f7; fill: var(--fd-padding-fill, #f5f7f7); }
  .fd-hatch-lines { stroke: #b9c2cc; stroke: var(--fd-padding-stroke, #b9c2cc); stroke-width: 1.5; }
  text { font-family: 'Fira Mono', Consolas, Menlo, Monaco, 'Courier New', monospace; font-family: var(--fd-font, 'Fira Mono', Consolas, Menlo, Monaco, 'Courier New', monospace); }
</style>
<rect class="fd-background" width="100%" height="100%" rx="8"/>
<defs><pattern id="fd-hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect class="fd-hatch-background" width="6" height="6"/><line class="fd-hatch-lines" x1="0" y1="0" x2="0" y2="6"/></pattern><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fd-pointer-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="fd-title" x="24.0" y="38.0" font-size="17" font-weight="700" text-anchor="start">The backlog keeps only the latest writes</text>
<rect class="fd-padding-box" x="24" y="120" width="58" height="44" rx="4"/>
<text class="fd-muted" x="53.0" y="147.6" font-size="16" font-weight="700" text-anchor="middle">1</text>
<rect class="fd-padding-box" x="88" y="120" width="58" height="44" rx="4"/>
<text class="fd-muted" x="117.0" y="147.6" font-size="16" font-weight="700" text-anchor="middle">2</text>
<rect class="fd-padding-box" x="152" y="120" width="58" height="44" rx="4"/>
<text class="fd-muted" x="181.0" y="147.6" font-size="16" font-weight="700" text-anchor="middle">3</text>
<rect class="fd-padding-box" x="216" y="120" width="58" height="44" rx="4"/>
<text class="fd-muted" x="245.0" y="147.6" font-size="16" font-weight="700" text-anchor="middle">4</text>
<rect class="fd-padding-box" x="280" y="120" width="58" height="44" rx="4"/>
<text class="fd-muted" x="309.0" y="147.6" font-size="16" font-weight="700" text-anchor="middle">5</text>
<rect class="fd-padding-box" x="344" y="120" width="58" height="44" rx="4"/>
<text class="fd-muted" x="373.0" y="147.6" font-size="16" font-weight="700" text-anchor="middle">6</text>
<rect class="fd-field-box" x="408" y="120" width="58" height="44" rx="4"/>
<text class="fd-field-label" x="437.0" y="147.6" font-size="16" font-weight="700" text-anchor="middle">7</text>
<rect class="fd-field-box" x="472" y="120" width="58" height="44" rx="4"/>
<text class="fd-field-label" x="501.0" y="147.6" font-size="16" font-weight="700" text-anchor="middle">8</text>
<rect class="fd-field-box" x="536" y="120" width="58" height="44" rx="4"/>
<text class="fd-field-label" x="565.0" y="147.6" font-size="16" font-weight="700" text-anchor="middle">9</text>
<rect class="fd-field-box" x="600" y="120" width="58" height="44" rx="4"/>
<text class="fd-field-label" x="629.0" y="147.6" font-size="16" font-weight="700" text-anchor="middle">10</text>
<rect class="fd-field-box" x="664" y="120" width="58" height="44" rx="4"/>
<text class="fd-field-label" x="693.0" y="147.6" font-size="16" font-weight="700" text-anchor="middle">11</text>
<rect class="fd-field-box" x="728" y="120" width="58" height="44" rx="4"/>
<text class="fd-field-label" x="757.0" y="147.6" font-size="16" font-weight="700" text-anchor="middle">12</text>
<path class="fd-leader-line" d="M 408 110 v -8 H 786 v 8"/>
<text class="fd-callout-label" x="597.0" y="94.0" font-size="14" font-weight="600" text-anchor="middle">in the backlog (the latest 10 MB)</text>
<text class="fd-muted" x="213.0" y="94.0" font-size="14" font-weight="600" text-anchor="middle">already dropped</text>
<line class="fd-pointer-arrow" x1="565.0" y1="196" x2="565.0" y2="167" marker-end="url(#head)"/>
<text class="fd-callout-label" x="565.0" y="214.0" font-size="14" font-weight="600" text-anchor="middle">replica A has up to here</text>
<line class="fd-pointer-arrow" x1="245.0" y1="196" x2="245.0" y2="167" marker-end="url(#head)"/>
<text class="fd-callout-label" x="245.0" y="214.0" font-size="14" font-weight="600" text-anchor="middle">replica B has up to here</text>
<text class="fd-callout-label" x="24.0" y="256.0" font-size="14" font-weight="600" text-anchor="start">Replica A gets only writes 10 to 12, which are still in the backlog: a partial sync.</text>
<text class="fd-callout-label" x="24.0" y="280.0" font-size="14" font-weight="600" text-anchor="start">Replica B needs write 5, which is gone, so it gets all the data again: a full sync.</text>
</svg>
