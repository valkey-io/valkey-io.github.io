<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 286" width="818" height="286">
<style>
  .fd-background { fill: #ffffff; fill: var(--fd-background, #ffffff); }
  .fd-title { fill: #002a3a; fill: var(--fd-text, #002a3a); }
  .fd-field-box { fill: #6983ff; fill: var(--fd-field-fill, #6983ff); stroke: #30176e; stroke: var(--fd-field-border, #30176e); stroke-width: 1; }
  .fd-extra-box { fill: #6983ff; fill: var(--fd-field-fill, #6983ff); fill-opacity: 0.18; stroke: #30176e; stroke: var(--fd-field-border, #30176e); stroke-width: 1; }
  .fd-padding-box { fill: url(#fd-hatch); stroke: #b9c2cc; stroke: var(--fd-padding-stroke, #b9c2cc); stroke-width: 1; }
  .fd-field-label { fill: #ffffff; fill: var(--fd-field-text, #ffffff); }
  .fd-callout-label { fill: #002a3a; fill: var(--fd-text, #002a3a); }
  .fd-muted { fill: #666666; fill: var(--fd-muted, #666666); }
  .fd-leader-line { stroke: #666666; stroke: var(--fd-muted, #666666); stroke-width: 1; fill: none; }
  .fd-pointer-arrow { stroke: #002a3a; stroke: var(--fd-text, #002a3a); stroke-width: 1.5; fill: none; }
  .fd-pointer-head { fill: #002a3a; fill: var(--fd-text, #002a3a); }
  .fd-hatch-background { fill: #f5f7f7; fill: var(--fd-padding-fill, #f5f7f7); }
  .fd-hatch-lines { stroke: #b9c2cc; stroke: var(--fd-padding-stroke, #b9c2cc); stroke-width: 1.5; }
  text { font-family: 'Fira Mono', Consolas, Menlo, Monaco, 'Courier New', monospace; font-family: var(--fd-font, 'Fira Mono', Consolas, Menlo, Monaco, 'Courier New', monospace); }
</style>
<rect class="fd-background" width="100%" height="100%" rx="8"/>
<defs><pattern id="fd-hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect class="fd-hatch-background" width="6" height="6"/><line class="fd-hatch-lines" x1="0" y1="0" x2="0" y2="6"/></pattern><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fd-pointer-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="fd-title" x="24.0" y="38.0" font-size="17" font-weight="700" text-anchor="start">Where compression applies</text>
<rect x="24" y="62" width="276" height="200" rx="8" fill="none" class="fd-leader-line" stroke-dasharray="5 4"/>
<rect x="518" y="62" width="276" height="200" rx="8" fill="none" class="fd-leader-line" stroke-dasharray="5 4"/>
<text class="fd-muted" x="38.0" y="84.0" font-size="13" font-weight="700" text-anchor="start">zone A</text>
<text class="fd-muted" x="532.0" y="84.0" font-size="13" font-weight="700" text-anchor="start">zone B</text>
<rect class="fd-field-box" x="62" y="104" width="200" height="56" rx="4"/>
<text class="fd-field-label" x="162.0" y="138.0" font-size="15" font-weight="700" text-anchor="middle">primary</text>
<rect class="fd-field-box" x="556" y="104" width="200" height="56" rx="4"/>
<text class="fd-field-label" x="656.0" y="138.0" font-size="15" font-weight="700" text-anchor="middle">replica</text>
<rect class="fd-extra-box" x="62" y="206" width="200" height="40" rx="4"/>
<text class="fd-callout-label" x="162.0" y="231.0" font-size="14" font-weight="600" text-anchor="middle">snapshot on disk</text>
<line class="fd-pointer-arrow" x1="162" y1="162" x2="162" y2="204" marker-end="url(#head)"/>
<text class="fd-callout-label" x="174.0" y="180.0" font-size="13" font-weight="600" text-anchor="start">snapshot</text>
<text class="fd-callout-label" x="174.0" y="198.0" font-size="13" font-weight="600" text-anchor="start">compression</text>
<line class="fd-pointer-arrow" x1="264" y1="120" x2="554" y2="120" marker-end="url(#head)"/>
<line class="fd-pointer-arrow" x1="264" y1="144" x2="554" y2="144" marker-end="url(#head)"/>
<text class="fd-callout-label" x="409.0" y="112.0" font-size="13" font-weight="600" text-anchor="middle">full sync</text>
<text class="fd-callout-label" x="409.0" y="162.0" font-size="13" font-weight="600" text-anchor="middle">write stream</text>
<text class="fd-muted" x="409.0" y="182.0" font-size="13" font-weight="600" text-anchor="middle">both use replication</text>
<text class="fd-muted" x="409.0" y="200.0" font-size="13" font-weight="600" text-anchor="middle">compression</text>
</svg>
