<text class="fd-muted" x="54.0" y="132.2" font-size="12" font-weight="700" text-anchor="middle">2</text>
<rect class="fd-padding-box" x="70" y="112" width="22" height="32" rx="4"/>
<text class="fd-muted" x="81.0" y="132.2" font-size="12" font-weight="700" text-anchor="middle">3</text>
