<text class="fd-muted" x="162.0" y="132.2" font-size="12" font-weight="700" text-anchor="middle">6</text>
<rect class="fd-field-box" x="178" y="112" width="22" height="32" rx="4"/>
<text class="fd-field-label" x="189.0" y="132.2" font-size="12" font-weight="700" text-anchor="middle">7</text>
<rect class="fd-field-box" x="205" y="112" width="22" height="32" rx="4"/>
<text class="fd-field-label" x="216.0" y="132.2" font-size="12" font-weight="700" text-anchor="middle">8</text>
<rect class="fd-field-box" x="232" y="112" width="22" height="32" rx="4"/>
<text class="fd-field-label" x="243.0" y="132.2" font-size="12" font-weight="700" text-anchor="middle">9</text>
<rect class="fd-field-box" x="259" y="112" width="22" height="32" rx="4"/>
<text class="fd-field-label" x="270.0" y="132.2" font-size="12" font-weight="700" text-anchor="middle">10</text>
