<text class="fd-field-label" x="297.0" y="132.2" font-size="12" font-weight="700" text-anchor="middle">11</text>
<rect class="fd-field-box" x="313" y="112" width="22" height="32" rx="4"/>
<text class="fd-field-label" x="324.0" y="132.2" font-size="12" font-weight="700" text-anchor="middle">12</text>
<path class="fd-leader-line" d="M 178 104 v -6 H 335 v 6"/>
<text class="fd-callout-label" x="256.5" y="90.0" font-size="13" font-weight="600" text-anchor="middle">backlog</text>
<text class="fd-muted" x="94.5" y="90.0" font-size="13" font-weight="600" text-anchor="middle">dropped</text>
<line class="fd-pointer-arrow" x1="243.0" y1="172" x2="243.0" y2="147" marker-end="url(#head)"/>
<text class="fd-callout-label" x="243.0" y="188.0" font-size="13" font-weight="600" text-anchor="middle">replica A</text>
<line class="fd-pointer-arrow" x1="108.0" y1="172" x2="108.0" y2="147" marker-end="url(#head)"/>
<text class="fd-callout-label" x="108.0" y="188.0" font-size="13" font-weight="600" text-anchor="middle">replica B</text>
<text class="fd-callout-label" x="16.0" y="226.0" font-size="13" font-weight="600" text-anchor="start">Replica A gets only writes 10 to 12:</text>
<text class="fd-callout-label" x="16.0" y="244.0" font-size="13" font-weight="700" text-anchor="start">a partial sync.</text>
<text class="fd-callout-label" x="16.0" y="272.0" font-size="13" font-weight="600" text-anchor="start">Replica B needs write 5, which is gone:</text>
<text class="fd-callout-label" x="16.0" y="290.0" font-size="13" font-weight="700" text-anchor="start">a full sync.</text>
