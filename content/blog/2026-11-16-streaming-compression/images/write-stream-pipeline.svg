<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 262" width="818" height="262">
<style>
  .fd-background { fill: #ffffff; fill: var(--fd-background, #ffffff); }
  .fd-title { fill: #002a3a; fill: var(--fd-text, #002a3a); }
  .fd-field-box { fill: #6983ff; fill: var(--fd-field-fill, #6983ff); stroke: #30176e; stroke: var(--fd-field-border, #30176e); stroke-width: 1; }
  .fd-extra-box { fill: #6983ff; fill: var(--fd-field-fill, #6983ff); fill-opacity: 0.18; stroke: #30176e; stroke: var(--fd-field-border, #30176e); stroke-width: 1; }
  .fd-padding-box { fill: url(#fd-hatch); stroke: #b9c2cc; stroke: var(--fd-padding-stroke, #b9c2cc); stroke-width: 1; }
  .fd-field-label { fill: #ffffff; fill: var(--fd-field-text, #ffffff); }
  .fd-callout-label { fill: #002a3a; fill: var(--fd-text, #002a3a); }
  .fd-muted { fill: #666666; fill: var(--fd-muted, #666666); }
  .fd-leader-line { stroke: #666666; stroke: var(--fd-muted, #666666); stroke-width: 1; fill: none; }
  .fd-pointer-arrow { stroke: #002a3a; stroke: var(--fd-text, #002a3a); stroke-width: 1.5; fill: none; }
  .fd-pointer-head { fill: #002a3a; fill: var(--fd-text, #002a3a); }
  .fd-hatch-background { fill: #f5f7f7; fill: var(--fd-padding-fill, #f5f7f7); }
  .fd-hatch-lines { stroke: #b9c2cc; stroke: var(--fd-padding-stroke, #b9c2cc); stroke-width: 1.5; }
  text { font-family: 'Fira Mono', Consolas, Menlo, Monaco, 'Courier New', monospace; font-family: var(--fd-font, 'Fira Mono', Consolas, Menlo, Monaco, 'Courier New', monospace); }
</style>
<rect class="fd-background" width="100%" height="100%" rx="8"/>
<defs><pattern id="fd-hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect class="fd-hatch-background" width="6" height="6"/><line class="fd-hatch-lines" x1="0" y1="0" x2="0" y2="6"/></pattern><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fd-pointer-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="fd-title" x="24.0" y="38.0" font-size="17" font-weight="700" text-anchor="start">Where the write stream is compressed</text>
<rect x="92" y="62" width="402" height="182" rx="8" fill="none" class="fd-leader-line" stroke-dasharray="5 4"/>
<text class="fd-muted" x="106.0" y="84.0" font-size="13" font-weight="700" text-anchor="start">primary</text>
<text class="fd-callout-label" x="24.0" y="146.0" font-size="14" font-weight="600" text-anchor="start">writes</text>
<line class="fd-pointer-arrow" x1="24" y1="156" x2="104" y2="156" marker-end="url(#head)"/>
<rect class="fd-extra-box" x="106" y="124" width="172" height="64" rx="4"/>
<text class="fd-callout-label" x="192.0" y="151.0" font-size="13" font-weight="700" text-anchor="middle">replication backlog</text>
<text class="fd-muted" x="192.0" y="172.0" font-size="13" font-weight="600" text-anchor="middle">uncompressed</text>
<path class="fd-pointer-arrow" d="M 280 156 C 305 156, 305 110, 330 110" marker-end="url(#head)"/>
<rect class="fd-field-box" x="332" y="88" width="150" height="44" rx="4"/>
<text class="fd-field-label" x="407.0" y="115.0" font-size="14" font-weight="700" text-anchor="middle">LZ4 compressor</text>
<line class="fd-pointer-arrow" x1="484" y1="110" x2="598" y2="110" stroke-dasharray="6 4" marker-end="url(#head)"/>
<rect class="fd-extra-box" x="600" y="82" width="194" height="56" rx="4"/>
<text class="fd-callout-label" x="697.0" y="104.0" font-size="14" font-weight="700" text-anchor="middle">replica 1</text>
<text class="fd-muted" x="697.0" y="125.0" font-size="13" font-weight="600" text-anchor="middle">decompress, apply</text>
<path class="fd-pointer-arrow" d="M 280 156 C 305 156, 305 202, 330 202" marker-end="url(#head)"/>
<rect class="fd-field-box" x="332" y="180" width="150" height="44" rx="4"/>
<text class="fd-field-label" x="407.0" y="207.0" font-size="14" font-weight="700" text-anchor="middle">LZ4 compressor</text>
<line class="fd-pointer-arrow" x1="484" y1="202" x2="598" y2="202" stroke-dasharray="6 4" marker-end="url(#head)"/>
<rect class="fd-extra-box" x="600" y="174" width="194" height="56" rx="4"/>
<text class="fd-callout-label" x="697.0" y="196.0" font-size="14" font-weight="700" text-anchor="middle">replica 2</text>
<text class="fd-muted" x="697.0" y="217.0" font-size="13" font-weight="600" text-anchor="middle">decompress, apply</text>
<text class="fd-muted" x="541.0" y="100.0" font-size="13" font-weight="600" text-anchor="middle">compressed</text>
</svg>
