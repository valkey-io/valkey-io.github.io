<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400">
<style>
  .fd-background { fill: #ffffff; fill: var(--fd-background, #ffffff); }
  .fd-title { fill: #002a3a; fill: var(--fd-text, #002a3a); }
  .fd-field-box { fill: #6983ff; fill: var(--fd-field-fill, #6983ff); stroke: #30176e; stroke: var(--fd-field-border, #30176e); stroke-width: 1; }
  .fd-extra-box { fill: #6983ff; fill: var(--fd-field-fill, #6983ff); fill-opacity: 0.18; stroke: #30176e; stroke: var(--fd-field-border, #30176e); stroke-width: 1; }
  .fd-padding-box { fill: url(#fd-hatch); stroke: #b9c2cc; stroke: var(--fd-padding-stroke, #b9c2cc); stroke-width: 1; }
  .fd-field-label { fill: #ffffff; fill: var(--fd-field-text, #ffffff); }
  .fd-callout-label { fill: #002a3a; fill: var(--fd-text, #002a3a); }
  .fd-muted { fill: #666666; fill: var(--fd-muted, #666666); }
  .fd-leader-line { stroke: #666666; stroke: var(--fd-muted, #666666); stroke-width: 1; fill: none; }
  .fd-pointer-arrow { stroke: #002a3a; stroke: var(--fd-text, #002a3a); stroke-width: 1.5; fill: none; }
  .fd-pointer-head { fill: #002a3a; fill: var(--fd-text, #002a3a); }
  .fd-hatch-background { fill: #f5f7f7; fill: var(--fd-padding-fill, #f5f7f7); }
  .fd-hatch-lines { stroke: #b9c2cc; stroke: var(--fd-padding-stroke, #b9c2cc); stroke-width: 1.5; }
  text { font-family: 'Fira Mono', Consolas, Menlo, Monaco, 'Courier New', monospace; font-family: var(--fd-font, 'Fira Mono', Consolas, Menlo, Monaco, 'Courier New', monospace); }
</style>
<rect class="fd-background" width="100%" height="100%" rx="8"/>
<defs><pattern id="fd-hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect class="fd-hatch-background" width="6" height="6"/><line class="fd-hatch-lines" x1="0" y1="0" x2="0" y2="6"/></pattern><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fd-pointer-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="fd-title" x="16.0" y="30.0" font-size="16" font-weight="700" text-anchor="start">Where the write stream</text>
<text class="fd-title" x="16.0" y="52.0" font-size="16" font-weight="700" text-anchor="start">is compressed</text>
<text class="fd-callout-label" x="180.0" y="76.0" font-size="13" font-weight="600" text-anchor="middle">writes</text>
<line class="fd-pointer-arrow" x1="180" y1="82" x2="180" y2="110" marker-end="url(#head)"/>
<rect x="16" y="96" width="328" height="184" rx="8" fill="none" class="fd-leader-line" stroke-dasharray="5 4"/>
<text class="fd-muted" x="28.0" y="272.0" font-size="13" font-weight="700" text-anchor="start">primary</text>
<rect class="fd-extra-box" x="90" y="112" width="180" height="52" rx="4"/>
<text class="fd-callout-label" x="180.0" y="134.0" font-size="13" font-weight="700" text-anchor="middle">replication backlog</text>
<text class="fd-muted" x="180.0" y="153.0" font-size="13" font-weight="600" text-anchor="middle">uncompressed</text>
<path class="fd-pointer-arrow" d="M 180 166 C 180 186, 100 182, 100 200" marker-end="url(#head)"/>
<rect class="fd-field-box" x="30" y="202" width="140" height="44" rx="4"/>
<text class="fd-field-label" x="100.0" y="229.0" font-size="13" font-weight="700" text-anchor="middle">LZ4 compressor</text>
<line class="fd-pointer-arrow" x1="100" y1="248" x2="100" y2="322" stroke-dasharray="6 4" marker-end="url(#head)"/>
<rect class="fd-extra-box" x="30" y="324" width="140" height="56" rx="4"/>
<text class="fd-callout-label" x="100.0" y="347.0" font-size="13" font-weight="700" text-anchor="middle">replica 1</text>
<text class="fd-muted" x="100.0" y="367.0" font-size="12" font-weight="600" text-anchor="middle">decompress, apply</text>
<path class="fd-pointer-arrow" d="M 180 166 C 180 186, 260 182, 260 200" marker-end="url(#head)"/>
<rect class="fd-field-box" x="190" y="202" width="140" height="44" rx="4"/>
<text class="fd-field-label" x="260.0" y="229.0" font-size="13" font-weight="700" text-anchor="middle">LZ4 compressor</text>
<line class="fd-pointer-arrow" x1="260" y1="248" x2="260" y2="322" stroke-dasharray="6 4" marker-end="url(#head)"/>
<rect class="fd-extra-box" x="190" y="324" width="140" height="56" rx="4"/>
<text class="fd-callout-label" x="260.0" y="347.0" font-size="13" font-weight="700" text-anchor="middle">replica 2</text>
<text class="fd-muted" x="260.0" y="367.0" font-size="12" font-weight="600" text-anchor="middle">decompress, apply</text>
<text class="fd-muted" x="180.0" y="304.0" font-size="13" font-weight="600" text-anchor="middle">compressed</text>
</svg>
