<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="FakeValkey: testing without a server">
  <title>FakeValkey: testing without a server</title>
  <defs>
    <linearGradient id="fv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30176E"/>
      <stop offset="1" stop-color="#1B0D45"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#fv-bg)"/>

  <!-- Content is centered so that the blog hero's object-fit: cover crops only background at any width -->

  <!-- ===== Mark: a test process window with a dashed (fake) server inside it ===== -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Test process window -->
    <rect x="170" y="185" width="260" height="260" rx="18" stroke="#E7E4F4" stroke-width="4"/>
    <path d="M170,229 L430,229" stroke="#E7E4F4" stroke-width="4"/>
    <g fill="#E7E4F4" stroke="none">
      <circle cx="198" cy="207" r="6"/>
      <circle cx="220" cy="207" r="6"/>
      <circle cx="242" cy="207" r="6"/>
    </g>

    <!-- The in-memory server, drawn as a dashed wireframe -->
    <g stroke="#6983FF" stroke-width="4" stroke-dasharray="8 8">
      <ellipse cx="300" cy="292" rx="62" ry="20"/>
      <path d="M238,292 L238,382 A62,20 0 0 0 362,382 L362,292"/>
      <path d="M238,337 A62,20 0 0 0 362,337"/>
    </g>

    <!-- Passing test badge -->
    <circle cx="392" cy="407" r="24" fill="#6983FF" stroke="#30176E" stroke-width="6"/>
    <path d="M381,408 L389,416 L404,399" stroke="#FFFFFF" stroke-width="5"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <g font-family="'Open Sans', 'Segoe UI', 'Helvetica Neue', Arial, system-ui, sans-serif">
    <text x="506" y="330" font-size="92" font-weight="800" letter-spacing="-2">
      <tspan fill="#A9B8FF">Fake</tspan><tspan fill="#FFFFFF">Valkey</tspan>
    </text>
    <text x="510" y="382" font-size="29" font-weight="500" letter-spacing="1.5" fill="#C9C3E6">Testing without a server</text>
  </g>
</svg>
