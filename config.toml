base_url = "https://valkey.io"
title = "Valkey"

compile_sass = true

build_search_index = true

generate_feeds = true

taxonomies = [
    { name = "blog_type", render = false },
]

# Reference files that live alongside content but should not be published
ignored_content = ["*.example"]

[markdown.highlighting]
theme = "github-dark-default"

# Needed to stop certain command topics from being destroyed by the slugifier
[slugify]
"paths" = "safe"

# This is included to override any differences slugs and documentation source filenames
[extra.slug_source_exceptions]
"valkey-conf" = "valkey.conf"

[extra]
command_description_path = "../build-command-docs/"
command_json_path = "../build-command-json/"
command_bloom_json_path = "../build-bloom-command-json/"
command_json_json_path = "../build-json-command-json/"
command_search_json_path = "../build-search-command-json/"
client_json_path = "../build-clients/"
doc_topic_path = "../build-topics/"

# Documentation menu. The core menu is nav.yml in the valkey docs; each module
# can provide a menu file that is merged into it, in the order listed here.
nav_path = "../build-nav/nav.yml"
nav_modules_path = "../build-nav/modules-nav/"
nav_modules = ["valkey-bloom", "valkey-json", "valkey-search", "valkey-ldap", "valkey-bundle"]

review_list = [
    "/topics/license/",
    "/topics/admin/",
    "/topics/distlock/",
    "/topics/eval-intro/",
    "/topics/faq/",
    "/topics/functions-intro/",
    "/topics/hashes/",
    "/topics/internals-eventlib/",
    "/topics/internals-vm/",
    "/topics/internals/",
    "/topics/latency/",
    "/topics/lua-api/",
    "/topics/rdd/",
    "/topics/history/"
]

publish_hold = [
    "/topics/license/",
    "/topics/internals-eventlib/",
    "/topics/internals-vm/",
    "/topics/internals/",
    "/topics/rdd/"
]

# Labels shown next to menu entries that come from a module's menu file.
[extra.nav_badges]
"valkey-bloom" = "module"
"valkey-json" = "module"
"valkey-search" = "module"
"valkey-ldap" = "module"
