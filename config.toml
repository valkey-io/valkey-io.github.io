base_url = "https://valkey.io"
title = "Valkey"

compile_sass = true

generate_feeds = true

taxonomies = [
    { name = "blog_type", render = false },
]

# Reference files that live alongside content but should not be published
ignored_content = ["*.example"]

[markdown.highlighting]
theme = "github-dark-default"

# Needed to stop certain command topics from being destroyed by the slugifier
[slugify]
"paths" = "safe"

# This is included to override any differences slugs and documentation source filenames
[extra.slug_source_exceptions]
"valkey-conf" = "valkey.conf"

[extra]
command_description_path = "../build-command-docs/"
command_json_path = "../build-command-json/"
command_bloom_json_path = "../build-bloom-command-json/"
command_json_json_path = "../build-json-command-json/"
command_search_json_path = "../build-search-command-json/"
doc_topic_path = "../build-topics/"

# Documentation menu. The core menu is nav.yml in the valkey docs, next to
# the topics directory. Other sources, such as modules, can provide a menu
# file that is merged into it, in the order listed here. Without nav.yml, the
# menu only has the command reference.
nav_path = "../build-topics/../nav.yml"
nav_sources_path = "../build-topics/../modules-nav/"
nav_sources = ["valkey-bloom", "valkey-json", "valkey-search", "valkey-ldap", "valkey-bundle"]

# Topics with known problems, shown with a "This page is under review" note.
review_list = [
    "/topics/distlock/"
]

# Labels shown next to menu entries from other sources, by source name. Only
# modules get one; valkey-bundle isn't a module.
[extra.nav_badges]
"valkey-bloom" = "module"
"valkey-json" = "module"
"valkey-search" = "module"
"valkey-ldap" = "module"
